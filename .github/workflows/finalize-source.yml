name: Finalize source import

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore application source
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .bootstrap/source.part00.txt
            printf 'E'
            cat .bootstrap/source.part01.txt
            printf 'p'
            cat .bootstrap/source.part02.txt
            cat .bootstrap/source.part{03..14}.txt
          } | tr -d '\r\n' | base64 --decode > /tmp/demoflow-source.zip
          unzip -t /tmp/demoflow-source.zip
          unzip -oq /tmp/demoflow-source.zip -d .
          cp build_macos.command build_macos.sh
          chmod +x build_macos.sh build_macos.command build_all_from_mac.command run_macos.sh run_built_macos_debug.command setup_macos.sh
          rm -rf .bootstrap

      - name: Verify restored files
        shell: bash
        run: |
          test -f app.py
          test -f assets/app_icon.png
          test -f assets/app_icon.ico
          test -f demoflow/engine.py
          test -f demoflow/dom_inspector.py
          test -f demoflow/recorder.py
          test -f demoflow/tour_builder.py
          python scripts/verify.py

      - name: Commit final repository
        shell: bash
        run: |
          git config user.name 'Marcos Dev'
          git config user.email 'marcos@marcosolter.com.br'
          git add -A
          git commit -m 'feat: publish Marcos DemoFlow 2.18.0 source'
          git push
